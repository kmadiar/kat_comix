{%- comment -%} Like-knop voor een strip. Gebruik: {% include like.html strip=c %} {%- endcomment -%}
{%- assign s = include.strip -%}
{%- assign r = site.data.series | where: "id", s.series | first -%}
{%- assign kaft = s.cover | default: r.cover | default: s.panels[0].image -%}
<button type="button" class="btn like-btn{% if include.class %} {{ include.class }}{% endif %}" aria-pressed="false"
  data-like="{{ s.url | relative_url }}"
  data-title="{{ s.title | escape }}"
  data-meta="{{ r.name | escape }} · Aflevering {{ s.episode }}"
  data-img="{% if kaft %}{{ kaft | relative_url }}{% endif %}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2A5.3 5.3 0 0 1 12 6.1a5.3 5.3 0 0 1 9.6 5.2c-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>
  <span class="like-btn__label">Liken</span>
</button>
